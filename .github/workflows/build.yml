name: Build and Release GokturkOBS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.15.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION (expected e.g. 1.15.0)"
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "GokturkOBS $TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"

      - name: Remove missing legacy resources from project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("GokturkOBS.xcodeproj/project.pbxproj")
          lines = project.read_text().splitlines(keepends=True)
          missing = ("TARAMALAR-API.md", "LimeOBS_Temiz_Dagitim.zip")
          lines = [line for line in lines if not any(name in line for name in missing)]
          project.write_text("".join(lines))
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned macOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project GokturkOBS.xcodeproj \
            -scheme GokturkOBS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GokturkOBS-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG installer
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GokturkOBS-build/Build/Products/Release/GokturkOBS.app"
          STAGING="$RUNNER_TEMP/GokturkOBS-dmg"
          DMG="$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg"
          test -d "$APP"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/GokturkOBS.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "GokturkOBS" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GokturkOBS-macOS-unsigned-DMG
          path: ${{ runner.temp }}/GokturkOBS-macOS-unsigned.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$VERSION"
          else
            TAG="$REF_NAME"
          fi
          gh release create "$TAG" "$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg" \
            --title "GokturkOBS $TAG" \
            --generate-notes \
            --verify-tag
